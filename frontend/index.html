<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Delivery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Local Delivery</span>
    <div id="nav"></div>
  </nav>

  <div class="container my-4">
    <h4 id="welcome" class="mb-3"></h4>
    <input id="search" class="form-control mb-4" placeholder="Search stores...">
    <div id="stores" class="row g-3"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = getUser();
    const nav = document.getElementById('nav');
    if (user) {
      document.getElementById('welcome').textContent = `Hello, ${user.name}`;
      nav.innerHTML = '<button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>';
    } else {
      nav.innerHTML = '<a class="btn btn-outline-light btn-sm" href="/pages/login.html">Login</a>';
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadStores(search = '') {
      const stores = await api('/stores?search=' + encodeURIComponent(search));
      document.getElementById('stores').innerHTML = stores.map((s) => `
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5>${escapeHtml(s.name)}</h5>
              <p class="text-muted mb-1">${escapeHtml(s.category)} · ${escapeHtml(s.city)}</p>
              <span class="badge ${s.isOpen ? 'bg-success' : 'bg-secondary'}">${s.isOpen ? 'Open' : 'Closed'}</span>
            </div>
            <div class="card-footer bg-white border-0">
              <a class="btn btn-primary btn-sm" href="/pages/store.html?id=${s.id}">View menu</a>
            </div>
          </div>
        </div>`).join('') || '<p class="text-muted">No stores found.</p>';
    }

    document.getElementById('search').addEventListener('input', (e) => loadStores(e.target.value));
    loadStores();
  </script>
</body>
</html>
