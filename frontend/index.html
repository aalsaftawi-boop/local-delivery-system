<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Delivery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Local Delivery</span>
    <div id="nav"></div>
  </nav>

  <div class="container mt-4">
    <h4 id="welcome">Welcome!</h4>
    <p>Stores will appear here in Sprint 2.</p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = getUser();
    const nav = document.getElementById('nav');
    if (user) {
      document.getElementById('welcome').textContent = `Hello, ${user.name} (${user.role})`;
      nav.innerHTML = '<button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>';
    } else {
      nav.innerHTML = '<a class="btn btn-outline-light btn-sm" href="/pages/login.html">Login</a>';
    }
  </script>
</body>
</html>
