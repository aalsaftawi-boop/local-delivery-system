<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/index.html">Local Delivery</a>
  </nav>

  <div class="container my-4">
    <div id="error" class="alert alert-danger d-none"></div>
    <h3 id="name"></h3>
    <p id="info" class="text-muted"></p>
    <div id="menu" class="row g-3"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const id = new URLSearchParams(location.search).get('id');

    api('/stores/' + id).then((s) => {
      document.getElementById('name').textContent = s.name;
      document.getElementById('info').textContent = `${s.category} · ${s.city} · ${s.address}`;
      document.getElementById('menu').innerHTML = s.menuItems.map((i) => `
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h6>${escapeHtml(i.name)}</h6>
              <p class="text-muted small mb-1">${escapeHtml(i.description || '')}</p>
              <strong>${i.price.toFixed(2)}</strong>
            </div>
          </div>
        </div>`).join('') || '<p class="text-muted">No items available.</p>';
    }).catch((e) => {
      const box = document.getElementById('error');
      box.textContent = e.message;
      box.classList.remove('d-none');
    });
  </script>
</body>
</html>
