<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Store Dashboard</span>
    <div>
      <a class="btn btn-warning btn-sm" href="/pages/admin/orders.html">Orders</a>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container my-4">
    <div id="msg" class="alert d-none"></div>

    <!-- Shown when the admin has no store yet -->
    <div id="createStore" class="card shadow-sm d-none">
      <div class="card-body">
        <h5>Create your store</h5>
        <form id="storeForm" class="row g-3">
          <div class="col-md-6"><input id="sName" class="form-control" placeholder="Store name" required></div>
          <div class="col-md-6"><input id="sCategory" class="form-control" placeholder="Category (Restaurant, Grocery...)" required></div>
          <div class="col-md-6"><input id="sCity" class="form-control" placeholder="City" required></div>
          <div class="col-md-6"><input id="sAddress" class="form-control" placeholder="Address" required></div>
          <div class="col-12"><input id="sPhone" class="form-control" placeholder="Phone (optional)"></div>
          <div class="col-12"><button class="btn btn-primary">Create store</button></div>
        </form>
      </div>
    </div>

    <!-- Shown when the store exists -->
    <div id="menuSection" class="d-none">
      <h4 id="storeTitle" class="mb-3"></h4>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5>Add menu item</h5>
          <form id="itemForm" class="row g-3">
            <div class="col-md-4"><input id="iName" class="form-control" placeholder="Item name" required></div>
            <div class="col-md-2"><input id="iPrice" type="number" step="0.01" min="0" class="form-control" placeholder="Price" required></div>
            <div class="col-md-3"><input id="iCategory" class="form-control" placeholder="Category"></div>
            <div class="col-md-3"><button class="btn btn-success w-100">Add</button></div>
            <div class="col-12"><input id="iDesc" class="form-control" placeholder="Description (optional)"></div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Your menu</h5>
          <table class="table align-middle">
            <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th></th></tr></thead>
            <tbody id="menuBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Only store admins may be here
    const me = getUser();
    if (!me || me.role !== 'STORE_ADMIN') window.location.href = '/pages/login.html';

    const $ = (id) => document.getElementById(id);

    function show(text, type = 'danger') {
      $('msg').className = `alert alert-${type}`;
      $('msg').textContent = text;
    }

    async function load() {
      const store = await api('/stores/mine');
      if (!store) {
        $('createStore').classList.remove('d-none');
        $('menuSection').classList.add('d-none');
        return;
      }
      $('createStore').classList.add('d-none');
      $('menuSection').classList.remove('d-none');
      $('storeTitle').textContent = `${store.name} (${store.city})`;
      await loadMenu();
    }

    async function loadMenu() {
      const items = await api('/menu/mine');
      $('menuBody').innerHTML = items.map((i) => `
        <tr>
          <td>${escapeHtml(i.name)}</td>
          <td>${escapeHtml(i.category || '-')}</td>
          <td>${i.price.toFixed(2)}</td>
          <td>
            <input type="checkbox" class="form-check-input" ${i.isAvailable ? 'checked' : ''}
              onchange="toggleItem(${i.id}, this.checked)">
          </td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${i.id})">Delete</button></td>
        </tr>`).join('') || '<tr><td colspan="5" class="text-muted">No items yet.</td></tr>';
    }

    // Prevents names with < > from breaking the page
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function toggleItem(id, isAvailable) {
      try {
        await api(`/menu/${id}`, { method: 'PUT', body: JSON.stringify({ isAvailable }) });
      } catch (e) { show(e.message); }
    }

    async function removeItem(id) {
      if (!confirm('Delete this item?')) return;
      try {
        await api(`/menu/${id}`, { method: 'DELETE' });
        loadMenu();
      } catch (e) { show(e.message); }
    }

    $('storeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/stores', {
          method: 'POST',
          body: JSON.stringify({
            name: $('sName').value, category: $('sCategory').value,
            city: $('sCity').value, address: $('sAddress').value, phone: $('sPhone').value,
          }),
        });
        show('Store created!', 'success');
        load();
      } catch (err) { show(err.message); }
    });

    $('itemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/menu', {
          method: 'POST',
          body: JSON.stringify({
            name: $('iName').value, price: $('iPrice').value,
            category: $('iCategory').value, description: $('iDesc').value,
          }),
        });
        $('itemForm').reset();
        $('msg').className = 'd-none';
        loadMenu();
      } catch (err) { show(err.message); }
    });

    load().catch((e) => show(e.message));
  </script>
</body>
</html>
