<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Incoming Orders</span>
    <div>
      <a class="btn btn-outline-light btn-sm" href="/pages/admin/dashboard.html">Menu</a>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container my-4">
    <div id="msg" class="alert alert-danger d-none"></div>
    <div id="orders"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const me = getUser();
    if (!me || me.role !== 'STORE_ADMIN') window.location.href = '/pages/login.html';

    const NEXT_LABEL = { PENDING: 'Accept → Preparing', PREPARING: 'Mark Ready' };
    let drivers = [];

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function err(e) {
      const box = document.getElementById('msg');
      box.textContent = e.message;
      box.classList.remove('d-none');
    }

    function card(o) {
      const canAssign = ['PREPARING', 'READY'].includes(o.status);
      return `
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <h5>Order #${o.id}</h5>
            <span class="badge bg-primary">${o.status}</span>
          </div>
          <p class="mb-1 text-muted">${esc(o.customer.name)} · ${esc(o.customerPhone)} · ${esc(o.deliveryAddressText)}</p>
          <ul class="mb-2">${o.items.map((i) => `<li>${i.quantity} × ${esc(i.nameSnapshot)}</li>`).join('')}</ul>
          <p class="mb-2"><strong>Total: ${o.total.toFixed(2)}</strong> (cash on delivery)</p>
          <div class="d-flex gap-2 align-items-center flex-wrap">
            ${NEXT_LABEL[o.status] ? `<button class="btn btn-success btn-sm" onclick="advance(${o.id})">${NEXT_LABEL[o.status]}</button>` : ''}
            ${o.status === 'PENDING' ? `<button class="btn btn-outline-danger btn-sm" onclick="cancelOrder(${o.id})">Cancel</button>` : ''}
            ${canAssign ? `
              <select class="form-select form-select-sm w-auto" onchange="assign(${o.id}, this.value)">
                <option value="">Assign driver...</option>
                ${drivers.map((d) => `<option value="${d.id}" ${o.driver && o.driver.id === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}
              </select>` : ''}
            ${o.driver ? `<span class="text-muted small">Driver: ${esc(o.driver.name)}</span>` : ''}
          </div>
        </div>
      </div>`;
    }

    async function load() {
      try {
        drivers = await api('/store-orders/drivers');
        const orders = await api('/store-orders');
        document.getElementById('orders').innerHTML = orders.map(card).join('') || '<p class="text-muted">No orders yet.</p>';
      } catch (e) { err(e); }
    }

    const advance = (id) => api(`/store-orders/${id}/status`, { method: 'PUT' }).then(load).catch(err);
    const cancelOrder = (id) => api(`/store-orders/${id}/cancel`, { method: 'PUT' }).then(load).catch(err);
    const assign = (id, driverId) => {
      if (!driverId) return;
      api(`/store-orders/${id}/driver`, { method: 'PUT', body: JSON.stringify({ driverId }) }).then(load).catch(err);
    };

    load();
    setInterval(load, 10000); // refresh every 10 seconds
  </script>
</body>
</html>
