<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/index.html">Local Delivery</a>
  </nav>

  <div class="container my-4" style="max-width: 560px;">
    <div id="msg" class="alert d-none"></div>
    <div class="card shadow-sm">
      <div class="card-body">
        <h4>Checkout</h4>
        <p class="text-muted">Payment: Cash on Delivery · Delivery fee: 5.00</p>
        <p>Subtotal: <strong id="subtotal">0.00</strong></p>

        <form id="form" class="row g-3">
          <div class="col-md-6"><input id="city" class="form-control" placeholder="City" required></div>
          <div class="col-md-6"><input id="street" class="form-control" placeholder="Street" required></div>
          <div class="col-md-6"><input id="building" class="form-control" placeholder="Building / floor"></div>
          <div class="col-md-6"><input id="phone" class="form-control" placeholder="Phone" required></div>
          <div class="col-12"><input id="notes" class="form-control" placeholder="Notes for the driver (optional)"></div>
          <div class="col-12"><button class="btn btn-success w-100">Place order</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = getUser();
    if (!user || user.role !== 'CUSTOMER') window.location.href = '/pages/login.html';
    const $ = (id) => document.getElementById(id);

    function show(text, type = 'danger') {
      $('msg').className = `alert alert-${type}`;
      $('msg').textContent = text;
    }

    api('/cart').then((c) => { $('subtotal').textContent = c.subtotal.toFixed(2); }).catch((e) => show(e.message));
    $('phone').value = '';

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const order = await api('/orders', {
          method: 'POST',
          body: JSON.stringify({
            city: $('city').value, street: $('street').value, building: $('building').value,
            phone: $('phone').value, customerNotes: $('notes').value,
          }),
        });
        show(`Order #${order.id} placed! Total: ${order.total.toFixed(2)}`, 'success');
        $('form').classList.add('d-none');
      } catch (err) { show(err.message); }
    });
  </script>
</body>
</html>
