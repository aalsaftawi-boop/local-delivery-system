<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/index.html">Local Delivery</a>
  </nav>

  <div class="container my-4">
    <div id="msg" class="alert alert-danger d-none"></div>
    <h3>Your cart <small id="storeName" class="text-muted fs-6"></small></h3>
    <table class="table align-middle bg-white">
      <thead><tr><th>Item</th><th>Price</th><th style="width:140px">Qty</th><th>Total</th><th></th></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="d-flex justify-content-between align-items-center">
      <h5>Subtotal: <span id="subtotal">0.00</span></h5>
      <div>
        <button class="btn btn-outline-secondary" onclick="clearCart()">Clear</button>
        <a id="checkoutBtn" class="btn btn-success" href="/pages/checkout.html">Checkout</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = getUser();
    if (!user || user.role !== 'CUSTOMER') window.location.href = '/pages/login.html';

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function err(e) {
      const box = document.getElementById('msg');
      box.textContent = e.message;
      box.classList.remove('d-none');
    }

    function render(cart) {
      document.getElementById('storeName').textContent = cart.store ? `from ${cart.store.name}` : '';
      document.getElementById('subtotal').textContent = cart.subtotal.toFixed(2);
      document.getElementById('checkoutBtn').classList.toggle('disabled', cart.items.length === 0);
      document.getElementById('body').innerHTML = cart.items.map((i) => `
        <tr>
          <td>${escapeHtml(i.name)}</td>
          <td>${i.price.toFixed(2)}</td>
          <td>
            <input type="number" min="1" value="${i.quantity}" class="form-control form-control-sm"
              onchange="setQty(${i.id}, this.value)">
          </td>
          <td>${i.lineTotal.toFixed(2)}</td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${i.id})">Remove</button></td>
        </tr>`).join('') || '<tr><td colspan="5" class="text-muted">Your cart is empty.</td></tr>';
    }

    const load = () => api('/cart').then(render).catch(err);
    const setQty = (id, q) => api('/cart/items/' + id, { method: 'PUT', body: JSON.stringify({ quantity: q }) }).then(render).catch(err);
    const removeItem = (id) => api('/cart/items/' + id, { method: 'DELETE' }).then(render).catch(err);
    const clearCart = () => api('/cart', { method: 'DELETE' }).then(render).catch(err);

    load();
  </script>
</body>
</html>
