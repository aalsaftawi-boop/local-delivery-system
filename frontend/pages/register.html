<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 420px;">
    <div class="card shadow-sm my-5">
      <div class="card-body p-4">
        <h3 class="mb-4 text-center">Create Account</h3>
        <div id="error" class="alert alert-danger d-none"></div>

        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input id="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input id="phone" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min 6 characters)</label>
            <input type="password" id="password" class="form-control" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">I am a</label>
            <select id="role" class="form-select">
              <option value="CUSTOMER">Customer</option>
              <option value="STORE_ADMIN">Store Admin</option>
              <option value="DRIVER">Delivery Driver</option>
            </select>
          </div>
          <button class="btn btn-primary w-100">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Have an account? <a href="/pages/login.html">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error');
      errorBox.classList.add('d-none');

      try {
        const data = await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
          }),
        });
        saveSession(data);
        window.location.href = homeFor(data.user.role);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
