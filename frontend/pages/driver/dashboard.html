<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">My Deliveries</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </nav>

  <div class="container my-4">
    <div id="msg" class="alert alert-danger d-none"></div>
    <div id="orders"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const me = getUser();
    if (!me || me.role !== 'DRIVER') window.location.href = '/pages/login.html';

    const ACTION = { READY: 'Start delivery', OUT_FOR_DELIVERY: 'Mark delivered' };

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function err(e) {
      const box = document.getElementById('msg');
      box.textContent = e.message;
      box.classList.remove('d-none');
    }

    function card(o) {
      return `
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <h5>Order #${o.id}</h5>
            <span class="badge bg-primary">${o.status}</span>
          </div>
          <p class="mb-1"><strong>Pickup:</strong> ${esc(o.store.name)} · ${esc(o.store.address)}</p>
          <p class="mb-1"><strong>Deliver to:</strong> ${esc(o.customer.name)} · ${esc(o.deliveryAddressText)}</p>
          <p class="mb-1"><strong>Phone:</strong> ${esc(o.customerPhone)}</p>
          <p class="mb-2"><strong>Collect cash:</strong> ${o.total.toFixed(2)}</p>
          ${ACTION[o.status] ? `<button class="btn btn-success btn-sm" onclick="advance(${o.id})">${ACTION[o.status]}</button>` : ''}
          ${o.status === 'PREPARING' ? '<span class="text-muted small">Waiting for the store to finish preparing...</span>' : ''}
        </div>
      </div>`;
    }

    async function load() {
      try {
        const orders = await api('/deliveries');
        document.getElementById('orders').innerHTML = orders.map(card).join('') || '<p class="text-muted">No deliveries assigned.</p>';
      } catch (e) { err(e); }
    }

    const advance = (id) => api(`/deliveries/${id}/status`, { method: 'PUT' }).then(load).catch(err);

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
